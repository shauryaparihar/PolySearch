[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend", "."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
# Legacy research scripts are kept as-is until they are replaced phase by phase.
extend-exclude = [
    "src", "web_app", "colab_encoding", ".venv", "frontend",
    "backend/migrations/versions",  # autogenerated
]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
