[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend", "."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
# Legacy research scripts are kept as-is until they are replaced phase by phase.
extend-exclude = [
    "src", "web_app", "colab_encoding", ".venv", "frontend",
    "backend/migrations/versions",  # autogenerated
]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.isort]
# backend/scripts is imported by tests via pythonpath; keep it grouped like "app", not as
# first-party just because a repository-level scripts/ folder exists.
known-third-party = ["scripts"]
