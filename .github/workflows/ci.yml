name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: polysearch
          POSTGRES_PASSWORD: polysearch_ci
          POSTGRES_DB: polysearch_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U polysearch -d polysearch_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      REQUIRE_DB: "1"
      TEST_DATABASE_URL: postgresql+psycopg://polysearch:polysearch_ci@localhost:5433/polysearch_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      # CPU-only PyTorch wheels: the default Linux wheel pulls gigabytes of CUDA libraries.
      - run: pip install -r backend/requirements-dev.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - run: ruff check .
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
