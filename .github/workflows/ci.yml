name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: polysearch
          POSTGRES_PASSWORD: polysearch_ci
          POSTGRES_DB: polysearch_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U polysearch -d polysearch_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      REQUIRE_DB: "1"
      TEST_DATABASE_URL: postgresql+psycopg://polysearch:polysearch_ci@localhost:5433/polysearch_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.txt
            backend/constraints.txt
      # CPU-only PyTorch wheels (the default Linux wheel pulls gigabytes of CUDA libraries);
      # exact versions come from backend/constraints.txt.
      - run: >-
          pip install -r backend/requirements-dev.txt -c backend/constraints.txt
          --extra-index-url https://download.pytorch.org/whl/cpu
      - run: ruff check .
      # The migrations must apply to an empty database exactly as in a fresh deployment.
      - name: Alembic upgrade (empty database)
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: alembic upgrade head
      # The transformer is never downloaded in CI: tests use a deterministic fake encoder.
      - run: pytest

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  # Builds both images and boots the Compose stack from empty volumes (no model download):
  # proves the Dockerfiles, Compose wiring, migrations, probes and safe failure behaviour.
  containers:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: scripts/stack_smoke.sh
